<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TouchKeys &mdash; Virtual Controller</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <meta name="description" content="Turn any mobile device into a gamepad controller.">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="/static/css/main.css?v=10">
</head>
<body>
  <section id="mobile-home" class="mobile-home">
    <div class="mobile-home-brand">TouchKeys</div>
    <div class="mobile-home-panel">
      <div id="mobile-home-status" class="mobile-home-status">Connecting…</div>
      <div id="device-info" class="device-info hidden">
        <span id="device-name-display" class="device-name-text"></span>
        <span id="device-status" class="device-status"></span>
      </div>
      <div id="connection-badge" class="connection-badge disconnected">
        <span class="connection-text">OFF</span>
        <span id="latency-value" class="latency-badge">--</span>
      </div>
      <div id="page-tabs" class="page-tabs mobile-home-pages">
        <div id="page-tabs-list"></div>
      </div>
      <button id="mobile-start" class="mobile-start" type="button" disabled>Start</button>
    </div>
  </section>
  <div id="screen-gamepad" class="screen-gamepad">

    <button id="btn-cog" class="cog-btn" aria-label="Controller settings"><span class="material-symbols-rounded">settings</span></button>

    <main class="workspace-container">
      <video id="screen-stream" class="screen-stream" autoplay playsinline muted></video>
      <div id="stream-overlay" class="stream-overlay hidden"><span class="stream-live-dot"></span><span id="stream-overlay-label">DESKTOP STREAM</span></div>
      <div id="workspace" class="workspace play-mode"></div>
    </main>

  </div>

  <script type="module" src="/static/js/app.js?v=10"></script>
</body>
</html>
